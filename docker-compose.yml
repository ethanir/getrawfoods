services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: getrawfoods
      POSTGRES_PASSWORD: getrawfoods
      POSTGRES_DB: getrawfoods
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U getrawfoods"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://getrawfoods:getrawfoods@db:5432/getrawfoods
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
